name: simple_quizlet_mobile_app
description: "SimpleQuizlet - Ứng dụng học từ vựng tiếng Anh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # Navigation
  go_router: ^14.8.0

  # Storage
  shared_preferences: ^2.5.2

  # Logging
  logger: ^2.5.0

  # Utilities
  intl: ^0.20.2

  # Fonts (Inter ≈ CircularSp for Spotify design)
  google_fonts: ^6.2.1

  # Local Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/brain.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/brain.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/
